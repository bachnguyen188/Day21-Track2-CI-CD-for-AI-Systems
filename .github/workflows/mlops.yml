name: MLOps Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chay unit tests tren du lieu ao (khong can GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huan luyen mo hinh tren du lieu thuc, upload artifact len cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: |
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          export MLFLOW_ARTIFACT_ROOT=./mlartifacts
          python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          accuracy=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$accuracy" >> $GITHUB_OUTPUT

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: outputs/report.txt

      - name: Upload model and metrics to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import json
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ['CLOUD_BUCKET'])
          
          # Bonus 4: So sanh voi model cu
          old_metrics_blob = bucket.blob("models/latest/metrics.json")
          is_better = True
          new_metrics = json.load(open("outputs/metrics.json"))
          new_accuracy = new_metrics["accuracy"]

          if old_metrics_blob.exists():
              old_metrics = json.loads(old_metrics_blob.download_as_text())
              if new_accuracy < old_metrics["accuracy"]:
                  print(f"WARNING: New accuracy ({new_accuracy}) is lower than old ({old_metrics['accuracy']}). Rollback triggered.")
                  is_better = False
          
          # Chi upload va cho phep deploy neu model tot hon hoac bang
          if is_better:
              # Upload model
              bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
              # Upload metrics
              bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
              print("Model updated as it's better or equal to the previous one.")
          else:
              # Neu kem hon, chung ta se thoat voi loi de chan cac buoc sau
              print("Deployment aborted due to lower performance.")
              exit(1)
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  # JOB 3: Kiem tra chat luong - chi cho phep deploy khi accuracy >= 0.70
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          accuracy = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy: {accuracy:.4f}")
          
          if accuracy < 0.70:
              print(f"FAILED: Accuracy {accuracy:.4f} is below threshold 0.70")
              exit(1)
          else:
              print(f"PASSED: Accuracy {accuracy:.4f} meets threshold 0.70")
          EOF

  # JOB 4: Trien khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 30
            curl -f http://localhost:8000/health || exit 1
            echo "Deployment successful!"
